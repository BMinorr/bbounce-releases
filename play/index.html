<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="noindex">
<title>bBounce Player</title>
<!--
  The page a bBounce QR code opens (Source/PlayerLink.h): what to play and where it was sent travel after the "#",
  which the browser never sends to a server. "z" + base64url of zlib-deflated lines:
  version, title, artist, project, colour, stream URL, then "name<TAB>url" for each link.
-->
<style>
  :root {
    --bg: #0a0a0c; --panel: rgba(255,255,255,.06); --edge: rgba(255,255,255,.08); --text: #f2f2f2; --dim: #8f8f8f;
    --tint: #ff8a3d; --accent: #ff8a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(120% 70% at 50% -10%, color-mix(in srgb, var(--tint) 55%, transparent), transparent 70%), var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 440px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .brand { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
  .cover {
    width: min(78vw, 300px); aspect-ratio: 1; margin: 22px auto 26px; border-radius: 16px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--tint) 85%, white 15%), color-mix(in srgb, var(--tint) 55%, black 45%));
    box-shadow: 0 18px 50px rgba(0,0,0,.5); display: grid; place-items: center;
    font-size: min(30vw, 120px); font-weight: 800; color: rgba(255,255,255,.92);
  }
  h1 { font-size: 24px; margin: 0; line-height: 1.2; overflow-wrap: anywhere; }
  .sub { color: var(--dim); font-size: 17px; margin-top: 4px; overflow-wrap: anywhere; }
  .bar { position: relative; height: 34px; margin-top: 22px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); }
  .fill { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--text); width: 0; }
  .knob { position: absolute; top: 10px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--text); left: 0; }
  .times { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 36px; margin: 18px 0 8px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .play { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .play:disabled { opacity: .35; cursor: default; }
  .skip { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text); position: relative; }
  .skip span { position: absolute; font-size: 9px; font-weight: 700; top: 17px; }
  .skip:disabled { opacity: .35; }
  .note { text-align: center; color: var(--dim); font-size: 14px; margin: 10px 0 0; min-height: 20px; }
  h2 { font-size: 12px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; margin: 30px 0 10px; }
  .links { display: grid; gap: 8px; }
  .link {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; text-decoration: none; color: var(--text);
    background: var(--panel); border: 1px solid var(--edge);
  }
  .link:active { background: rgba(255,255,255,.1); }
  .link .name { font-weight: 650; flex: 1; }
  .link .what { color: var(--dim); font-size: 14px; }
  .empty { text-align: center; padding: 80px 16px; color: var(--dim); }
  .empty h1 { color: var(--text); margin-bottom: 8px; }
  footer { text-align: center; color: var(--dim); font-size: 12px; margin-top: 34px; }
  footer a { color: var(--dim); }
  @media (prefers-reduced-motion: no-preference) { .fill, .knob { transition: none; } }
</style>
</head>
<body>
<main id="app">
  <div class="brand">bBounce</div>
  <div class="empty" id="loading">Loading…</div>
</main>
<audio id="audio" preload="metadata" playsinline></audio>
<script>
"use strict";
const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const safeUrl = (u) => /^https:\/\//i.test(u) ? u : "";

async function readTrack() {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (!hash.startsWith("z")) return null;
  const b64 = hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
  if (typeof DecompressionStream === "undefined") throw new Error("old-browser");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  const text = await new Response(stream).text();
  const lines = text.split("\n");
  if (lines[0] !== "1" || lines.length < 6) return null;
  const links = lines.slice(6).filter(Boolean).map(l => { const i = l.indexOf("\t"); return { name: l.slice(0, i), url: safeUrl(l.slice(i + 1)) }; })
                     .filter(l => l.url);
  return { title: lines[1], artist: lines[2], project: lines[3], colour: lines[4], stream: safeUrl(lines[5]), links };
}

function linkLabel(name) {
  if (name === "Samply") return "Listen, comment, download";
  if (name === "SoundCloud") return "Listen on SoundCloud";
  return "Download";
}

function showMessage(title, text) {
  const app = document.getElementById("app");
  app.querySelector("#loading")?.remove();
  app.append($(`<div class="empty"><h1>${esc(title)}</h1><div>${esc(text)}</div></div>`));
}

function render(t) {
  if (/^#[0-9a-f]{6}$/i.test(t.colour)) document.documentElement.style.setProperty("--tint", t.colour);
  document.title = t.title ? `${t.title} · bBounce` : "bBounce Player";
  const app = document.getElementById("app");
  app.querySelector("#loading").remove();
  const initial = (t.title || "?").trim().charAt(0).toUpperCase();
  const sub = [t.artist, t.project].filter(Boolean).join(" · ");
  app.append($(`<div class="cover" aria-hidden="true">${esc(initial)}</div>`));
  app.append($(`<div><h1>${esc(t.title || "Untitled")}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>`));

  const audio = document.getElementById("audio");
  const player = $(`<section aria-label="Player">
      <div class="bar" role="slider" aria-label="Position" tabindex="0"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
      <div class="times"><span id="pos">0:00</span><span id="len">–:––</span></div>
      <div class="controls">
        <button class="skip" id="back" aria-label="Back 15 seconds"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5.6 7.8A8 8 0 1 1 4 13"/><path d="M5.5 2.5 5 6.5l4 .5"/></svg><span>15</span></button>
        <button class="play" id="play" aria-label="Play"></button>
        <button class="skip" id="fwd" aria-label="Forward 15 seconds"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18.4 7.8A8 8 0 1 0 20 13"/><path d="M18.5 2.5 19 6.5l-4 .5"/></svg><span>15</span></button>
      </div>
      <p class="note" id="note"></p>
    </section>`);
  app.append(player);
  const play = player.querySelector("#play"), note = player.querySelector("#note");
  const bar = player.querySelector(".bar"), fill = player.querySelector(".fill"), knob = player.querySelector(".knob");
  const playIcon = `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5.5 19 12 8 18.5Z" fill="#111114" stroke="#111114" stroke-linejoin="round" stroke-width="1.5"/></svg>`;
  const pauseIcon = `<svg width="30" height="30" viewBox="0 0 24 24" fill="#111114"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>`;
  const sync = () => {
    play.innerHTML = audio.paused ? playIcon : pauseIcon;
    play.setAttribute("aria-label", audio.paused ? "Play" : "Pause");
    const d = audio.duration, p = audio.currentTime;
    const f = isFinite(d) && d > 0 ? Math.min(1, p / d) : 0;
    fill.style.width = (f * 100) + "%";
    knob.style.left = (f * 100) + "%";
    bar.setAttribute("aria-valuenow", Math.round(f * 100));
    player.querySelector("#pos").textContent = fmt(p);
    player.querySelector("#len").textContent = isFinite(d) ? fmt(d) : "–:––";
  };
  sync();

  if (!t.stream) {
    for (const b of player.querySelectorAll("button")) b.disabled = true;
    note.textContent = "This one can't play here: open it from one of the links below.";
  } else {
    audio.src = t.stream;
    audio.addEventListener("timeupdate", sync);
    audio.addEventListener("durationchange", sync);
    audio.addEventListener("play", sync);
    audio.addEventListener("pause", sync);
    audio.addEventListener("ended", sync);
    audio.addEventListener("waiting", () => { note.textContent = "Loading…"; });
    audio.addEventListener("playing", () => { note.textContent = ""; });
    audio.addEventListener("error", () => {
      note.textContent = "The file isn't there any more (quick links expire) or the connection dropped. The links below may still work.";
      play.disabled = true;
    });
    play.addEventListener("click", () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); });
    player.querySelector("#back").addEventListener("click", () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
    player.querySelector("#fwd").addEventListener("click", () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15); });
    const seek = (e) => {
      const r = bar.getBoundingClientRect();
      const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      if (isFinite(audio.duration)) { audio.currentTime = f * audio.duration; sync(); }
    };
    bar.addEventListener("pointerdown", (e) => { bar.setPointerCapture(e.pointerId); seek(e); });
    bar.addEventListener("pointermove", (e) => { if (bar.hasPointerCapture(e.pointerId)) seek(e); });
    bar.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") audio.currentTime += 5;
      else if (e.key === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === " " && e.target === document.body) { e.preventDefault(); play.click(); }
    });
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.project });
      navigator.mediaSession.setActionHandler("play", () => audio.play());
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("seekbackward", () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
      navigator.mediaSession.setActionHandler("seekforward", () => { audio.currentTime += 15; });
    }
  }

  const links = [...t.links];
  if (t.stream && !links.some(l => l.url === t.stream)) links.push({ name: "This file", url: t.stream });
  if (links.length) {
    app.append($(`<h2>Get it</h2>`));
    const list = $(`<div class="links"></div>`);
    for (const l of links)
      list.append($(`<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
          <span class="name">${esc(l.name)}</span><span class="what">${esc(l.name === "This file" ? "Download" : linkLabel(l.name))}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>`));
    app.append(list);
  }
  app.append($(`<footer>Sent with bBounce</footer>`));
}

readTrack().then(t => t ? render(t) : showMessage("Nothing to play", "Scan a QR code from bBounce to open a track here."))
           .catch(e => showMessage(e.message === "old-browser" ? "Update your browser" : "This link is damaged",
                                   e.message === "old-browser" ? "This page needs a newer browser to read the track." : "Scan the QR code again, or ask for a new one."));
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
